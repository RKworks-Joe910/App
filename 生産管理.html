<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生産管理システム</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Meiryo","Yu Gothic",sans-serif;background:#f0f4f8;color:#1a1a2e;font-size:13px}

/* ヘッダー */
header{background:linear-gradient(135deg,#1F4E79,#2E75B6);color:white;padding:12px 20px;
  display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.3);position:sticky;top:0;z-index:100}
header h1{font-size:18px;letter-spacing:1px}
.header-date{font-size:12px;opacity:.8}

/* タブ */
.tabs{display:flex;background:#1a3a5c;padding:0 20px}
.tab{padding:10px 22px;cursor:pointer;color:rgba(255,255,255,.6);font-size:13px;border-bottom:3px solid transparent;transition:.2s}
.tab.active{color:white;border-bottom-color:#FFD700;font-weight:bold}
.tab:hover{color:white}
.tab-content{display:none}
.tab-content.active{display:block}

/* サマリーカード */
.summary{display:flex;gap:12px;padding:14px 20px;flex-wrap:wrap}
.card{background:white;border-radius:10px;padding:12px 18px;min-width:130px;
  box-shadow:0 2px 6px rgba(0,0,0,.1);text-align:center;border-top:4px solid #ccc;flex:1}
.card.c-blue{border-color:#2E75B6}.card.c-green{border-color:#70AD47}
.card.c-red{border-color:#FF6B6B}.card.c-orange{border-color:#ED7D31}
.card .num{font-size:26px;font-weight:bold}.card .lbl{font-size:11px;color:#666;margin-top:2px}

/* ページパディング */
.page{padding:0 20px 30px}

/* テーブル共通 */
.tbl-wrap{overflow-x:auto;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
table{width:100%;border-collapse:collapse;background:white;border-radius:10px;overflow:hidden}
thead{background:#1F4E79;color:white;position:sticky;top:42px;z-index:5}
thead th{padding:9px 8px;text-align:center;white-space:nowrap;font-size:12px}
tbody tr:nth-child(even){background:#f7f9ff}
tbody tr:hover{background:#e8f0fe}
td{padding:7px 8px;border-bottom:1px solid #e8e8e8;vertical-align:middle}
td.center{text-align:center}
td.bold{font-weight:bold}

/* バッジ */
.badge{display:inline-block;padding:3px 8px;border-radius:12px;font-size:11px;font-weight:bold}
.badge-green{background:#70AD47;color:white}
.badge-blue{background:#2E75B6;color:white}
.badge-yellow{background:#FFD966;color:#7F6000}
.badge-red{background:#FF6B6B;color:white}
.badge-gray{background:#d0d0d0;color:#555}
.badge-orange{background:#ED7D31;color:white}

/* 納期 */
.deadline-ok{color:#70AD47;font-weight:bold}
.deadline-warn{color:#ED7D31;font-weight:bold}
.deadline-over{color:#FF6B6B;font-weight:bold}

/* プログレスバー */
.prog-wrap{min-width:80px}
.prog-bar{height:8px;background:#e0e0e0;border-radius:4px;overflow:hidden;margin-top:3px}
.prog-fill{height:100%;background:linear-gradient(90deg,#70AD47,#A9D18E);border-radius:4px;transition:width .4s}

/* ボタン */
.btn{padding:7px 14px;border:none;border-radius:6px;cursor:pointer;font-size:12px;font-weight:bold;transition:.2s}
.btn-primary{background:#1F4E79;color:white}.btn-primary:hover{background:#2E75B6}
.btn-success{background:#70AD47;color:white}.btn-success:hover{background:#548235}
.btn-danger{background:#FF6B6B;color:white}.btn-danger:hover{background:#d64747}
.btn-sm{padding:4px 10px;font-size:11px}
.btn-outline{background:white;border:2px solid #2E75B6;color:#2E75B6}
.btn-outline:hover{background:#2E75B6;color:white}

/* モーダル */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:white;border-radius:12px;padding:24px;width:min(700px,95vw);max-height:88vh;overflow-y:auto;
  box-shadow:0 8px 32px rgba(0,0,0,.3)}
.modal h2{font-size:16px;margin-bottom:16px;color:#1F4E79;border-bottom:2px solid #BDD7EE;padding-bottom:8px}

/* フォーム */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid.col3{grid-template-columns:1fr 1fr 1fr}
.form-full{grid-column:1/-1}
label{display:block;font-size:11px;color:#555;margin-bottom:3px;font-weight:bold}
input[type=text],input[type=date],input[type=number],select,textarea{
  width:100%;padding:7px 10px;border:1.5px solid #ccc;border-radius:6px;font-size:12px;
  font-family:inherit;transition:.2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:#2E75B6}
textarea{resize:vertical;min-height:60px}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

/* 工程ステップ選択 */
.steps-editor{border:1.5px solid #ccc;border-radius:8px;padding:12px}
.step-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.step-row input{flex:1}
.step-num{width:24px;height:24px;background:#1F4E79;color:white;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:bold;flex-shrink:0}

/* 工程進捗ステータス */
select.st-sel{width:80px;padding:3px 2px;border-radius:6px;border:none;font-size:11px;
  font-weight:bold;cursor:pointer;text-align:center}
select.st-done{background:#70AD47;color:white}
select.st-inprog{background:#2E75B6;color:white}
select.st-notyet{background:#FFD966;color:#7F6000}
select.st-skip{background:#e0e0e0;color:#aaa}

/* ツールバー */
.toolbar{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-bottom:12px}
.toolbar-left{display:flex;gap:8px;align-items:center}

/* 受注詳細 */
.order-detail{background:#f7f9ff;border-radius:8px;padding:12px;margin-top:8px}
.items-table{margin-top:8px}

/* 凡例 */
.legend{display:flex;gap:12px;padding:6px 20px;font-size:11px;flex-wrap:wrap;background:#f8f9fb;border-bottom:1px solid #e0e0e0}
.legend-item{display:flex;align-items:center;gap:4px}
.ld{width:12px;height:12px;border-radius:3px}

/* 空状態 */
.empty-state{text-align:center;padding:50px;color:#999}
.empty-state .icon{font-size:48px;margin-bottom:12px}

/* フィルターバー */
.filter-bar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.flt-btn{padding:5px 13px;border:1.5px solid #ccc;border-radius:16px;cursor:pointer;
  background:white;font-size:12px;transition:.2s}
.flt-btn.active{background:#1F4E79;color:white;border-color:#1F4E79}

@media(max-width:600px){.form-grid{grid-template-columns:1fr}.form-grid.col3{grid-template-columns:1fr}}
</style>
</head>
<body>

<header>
  <h1>🏭 生産管理システム</h1>
  <div style="display:flex;gap:12px;align-items:center">
    <span class="header-date" id="hdr-date"></span>
    <button class="btn btn-outline" onclick="exportData()" style="font-size:11px;padding:5px 10px">📥 データ出力</button>
  </div>
</header>

<div class="tabs">
  <div class="tab active" onclick="switchTab('dashboard')">📊 ダッシュボード</div>
  <div class="tab" onclick="switchTab('orders')">📋 受注管理</div>
  <div class="tab" onclick="switchTab('oneoff')">⚡ 単発案件</div>
  <div class="tab" onclick="switchTab('master')">🔧 工程マスタ</div>
</div>

<div class="legend">
  <div class="legend-item"><div class="ld" style="background:#70AD47"></div>完了</div>
  <div class="legend-item"><div class="ld" style="background:#2E75B6"></div>作業中</div>
  <div class="legend-item"><div class="ld" style="background:#FFD966"></div>未着手</div>
</div>

<!-- ========== ダッシュボード ========== -->
<div id="tab-dashboard" class="tab-content active">
  <div class="summary">
    <div class="card c-blue"><div class="num" id="d-orders">0</div><div class="lbl">受注件数</div></div>
    <div class="card c-orange"><div class="num" id="d-oneoff">0</div><div class="lbl">単発案件</div></div>
    <div class="card c-red"><div class="num" id="d-overdue">0</div><div class="lbl">納期超過</div></div>
    <div class="card c-green"><div class="num" id="d-done">0</div><div class="lbl">完了済み</div></div>
  </div>
  <div class="page">
    <h3 style="margin-bottom:10px;color:#1F4E79">⚠ 直近納期・要注意案件</h3>
    <div class="tbl-wrap">
    <table>
      <thead><tr><th>種別</th><th>案件名/受注No.</th><th>客先</th><th>納期</th><th>残り日数</th><th>進捗</th><th>ステータス</th></tr></thead>
      <tbody id="dash-tbody"></tbody>
    </table>
    </div>
  </div>
</div>

<!-- ========== 受注管理 ========== -->
<div id="tab-orders" class="tab-content">
  <div class="page" style="padding-top:14px">
    <div class="toolbar">
      <div class="toolbar-left">
        <div class="filter-bar">
          <div class="flt-btn active" onclick="setOrderFilter('all',this)">すべて</div>
          <div class="flt-btn" onclick="setOrderFilter('active',this)">進行中</div>
          <div class="flt-btn" onclick="setOrderFilter('done',this)">完了</div>
          <div class="flt-btn" onclick="setOrderFilter('overdue',this)">納期超過</div>
        </div>
      </div>
      <button class="btn btn-primary" onclick="openOrderModal()">＋ 新規受注登録</button>
    </div>
    <div class="tbl-wrap">
    <table>
      <thead><tr><th>受注No.</th><th>客先</th><th>受注日</th><th>目標納期</th><th>残り</th><th>品番/品名</th><th>数量</th><th>全体進捗</th><th>ステータス</th><th>操作</th></tr></thead>
      <tbody id="orders-tbody"></tbody>
    </table>
    </div>
  </div>
</div>

<!-- ========== 単発案件 ========== -->
<div id="tab-oneoff" class="tab-content">
  <div class="page" style="padding-top:14px">
    <div class="toolbar">
      <div class="filter-bar">
        <div class="flt-btn active" onclick="setOneoffFilter('all',this)">すべて</div>
        <div class="flt-btn" onclick="setOneoffFilter('active',this)">進行中</div>
        <div class="flt-btn" onclick="setOneoffFilter('done',this)">完了</div>
      </div>
      <button class="btn btn-primary" onclick="openOneoffModal()">＋ 新規単発案件登録</button>
    </div>
    <div class="tbl-wrap">
    <table>
      <thead><tr><th>案件名</th><th>客先</th><th>数量</th><th>目標納期</th><th>残り</th><th>工程進捗</th><th>ステータス</th><th>備考</th><th>操作</th></tr></thead>
      <tbody id="oneoff-tbody"></tbody>
    </table>
    </div>
  </div>
</div>

<!-- ========== 工程マスタ（進捗管理） ========== -->
<div id="tab-master" class="tab-content">
  <div class="page" style="padding-top:14px">
    <div class="filter-bar" style="margin-bottom:10px">
      <div class="flt-btn active" onclick="setMasterFilter('all',this)">すべて</div>
      <div class="flt-btn" onclick="setMasterFilter('notyet',this)">注残あり</div>
      <div class="flt-btn" onclick="setMasterFilter('done',this)">完了済み</div>
    </div>
    <div class="tbl-wrap">
    <table>
      <thead><tr><th>図番</th><th>品名</th><th style="width:240px">工程1</th><th style="width:80px">状態</th><th style="width:240px">工程2</th><th style="width:80px">状態</th><th style="width:240px">工程3</th><th style="width:80px">状態</th><th style="width:240px">工程4</th><th style="width:80px">状態</th><th>注残</th></tr></thead>
      <tbody id="master-tbody"></tbody>
    </table>
    </div>
  </div>
</div>

<!-- ========== 受注登録モーダル ========== -->
<div class="modal-bg" id="order-modal">
<div class="modal">
  <h2>📋 受注登録</h2>
  <div class="form-grid">
    <div>
      <label>受注No. *</label>
      <input type="text" id="o-no" placeholder="例: ORD-2025-001">
    </div>
    <div>
      <label>客先名 *</label>
      <input type="text" id="o-customer" placeholder="例: ○○工業株式会社">
    </div>
    <div>
      <label>受注日</label>
      <input type="date" id="o-orderdate">
    </div>
    <div>
      <label>目標納期 *</label>
      <input type="date" id="o-deadline">
    </div>
    <div>
      <label>数量</label>
      <input type="number" id="o-qty" min="1" value="1">
    </div>
    <div>
      <label>備考</label>
      <input type="text" id="o-notes" placeholder="特記事項など">
    </div>
  </div>
  
  <div style="margin-top:16px">
    <label style="display:flex;align-items:center;justify-content:space-between">
      <span>品番選択（複数追加可）</span>
      <button class="btn btn-sm btn-outline" onclick="addOrderItem()">＋ 品番追加</button>
    </label>
    <div id="o-items" style="margin-top:8px;max-height:260px;overflow-y:auto">
      <!-- 動的追加 -->
    </div>
  </div>
  
  <div class="form-actions">
    <button class="btn" onclick="closeOrderModal()" style="background:#eee">キャンセル</button>
    <button class="btn btn-primary" onclick="saveOrder()">💾 登録</button>
  </div>
</div>
</div>

<!-- ========== 受注詳細モーダル ========== -->
<div class="modal-bg" id="order-detail-modal">
<div class="modal" style="width:min(900px,95vw)">
  <h2 id="od-title">受注詳細</h2>
  <div id="od-info" style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px;background:#f0f4f8;padding:10px;border-radius:8px;font-size:12px"></div>
  <div id="od-items"></div>
  <div class="form-actions" style="margin-top:12px">
    <button class="btn" onclick="closeDetailModal()" style="background:#eee">閉じる</button>
    <button class="btn btn-danger btn-sm" id="od-delete-btn">🗑 削除</button>
  </div>
</div>
</div>

<!-- ========== 単発案件モーダル ========== -->
<div class="modal-bg" id="oneoff-modal">
<div class="modal">
  <h2>⚡ 単発案件登録</h2>
  <div class="form-grid">
    <div>
      <label>案件名 *</label>
      <input type="text" id="oo-name" placeholder="例: 特注ブラケット加工">
    </div>
    <div>
      <label>客先名</label>
      <input type="text" id="oo-customer" placeholder="例: ○○製作所">
    </div>
    <div>
      <label>数量</label>
      <input type="number" id="oo-qty" min="1" value="1">
    </div>
    <div>
      <label>目標納期</label>
      <input type="date" id="oo-deadline">
    </div>
    <div class="form-full">
      <label>備考</label>
      <textarea id="oo-notes" placeholder="特記事項など" rows="2"></textarea>
    </div>
  </div>
  
  <div style="margin-top:14px">
    <label style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
      <span>工程ステップ（順番に追加）</span>
      <div style="display:flex;gap:6px">
        <button class="btn btn-sm btn-outline" onclick="addOneoffStepFromList()">📋 既存から選ぶ</button>
        <button class="btn btn-sm btn-outline" onclick="addOneoffStepCustom()">＋ 手入力追加</button>
      </div>
    </label>
    <div id="oo-steps" class="steps-editor" style="min-height:60px"></div>
  </div>
  
  <div class="form-actions">
    <button class="btn" onclick="closeOneoffModal()" style="background:#eee">キャンセル</button>
    <button class="btn btn-primary" onclick="saveOneoff()">💾 登録</button>
  </div>
</div>
</div>

<!-- 既存工程選択ドロップダウン -->
<div class="modal-bg" id="step-picker-modal">
<div class="modal" style="width:min(500px,95vw);max-height:60vh">
  <h2>工程を選択</h2>
  <input type="text" id="step-search" placeholder="工程名で絞り込み..." oninput="filterSteps(this.value)" style="margin-bottom:10px">
  <div id="step-list" style="max-height:320px;overflow-y:auto;border:1px solid #eee;border-radius:6px"></div>
  <div class="form-actions">
    <button class="btn" onclick="document.getElementById('step-picker-modal').classList.remove('open')" style="background:#eee">キャンセル</button>
  </div>
</div>
</div>

// ==================== ユーティリティ ====================
function today(){ return new Date().toISOString().split('T')[0]; }

function daysLeft(deadline){
  if(!deadline) return null;
  const d = new Date(deadline) - new Date(today());
  return Math.ceil(d/(1000*60*60*24));
}

function deadlineBadge(deadline){
  if(!deadline) return '<span class="badge badge-gray">未設定</span>';
  const d = daysLeft(deadline);
  if(d < 0) return `<span class="badge badge-red">超過 ${Math.abs(d)}日</span>`;
  if(d <= 7) return `<span class="badge badge-orange">${d}日前</span>`;
  return `<span class="badge badge-green">${d}日前</span>`;
}

function statusBadge(pct){
  if(pct >= 100) return '<span class="badge badge-green">完了</span>';
  if(pct > 0)    return '<span class="badge badge-blue">進行中</span>';
  return '<span class="badge badge-yellow">未着手</span>';
}

function progBar(pct){
  return `<div class="prog-wrap"><div style="font-size:11px;color:#555">${Math.round(pct)}%</div>
    <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div></div>`;
}

function calcOrderPct(order){
  let total=0, done=0;
  (order.items||[]).forEach(item=>{
    (item.stepStatuses||[]).forEach(s=>{total++;if(s==='完了')done++;});
  });
  return total===0?0:Math.round(done/total*100);
}

function calcOneoffPct(oo){
  const ss = oo.stepStatuses||[];
  if(!ss.length) return 0;
  return Math.round(ss.filter(s=>s==='完了').length/ss.length*100);
}

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

// ==================== ダッシュボード ====================
function renderDashboard(){
  const orders = DB.orders||[];
  const oneoffs = DB.oneoff||[];
  const allCases = [
    ...orders.map(o=>({type:'受注',name:o.orderNo||'-',customer:o.customer,deadline:o.deadline,pct:calcOrderPct(o),id:o.id})),
    ...oneoffs.map(o=>({type:'単発',name:o.name,customer:o.customer,deadline:o.deadline,pct:calcOneoffPct(o),id:o.id}))
  ];

  let overdue=0, done=0;
  allCases.forEach(c=>{
    const d = daysLeft(c.deadline);
    if(d!==null && d<0 && c.pct<100) overdue++;
    if(c.pct>=100) done++;
  });
  document.getElementById('d-orders').textContent = orders.length;
  document.getElementById('d-oneoff').textContent = oneoffs.length;
  document.getElementById('d-overdue').textContent = overdue;
  document.getElementById('d-done').textContent = done;

  const sorted = allCases.filter(c=>c.pct<100).sort((a,b)=>{
    const da = a.deadline||'9999', db = b.deadline||'9999';
    return da.localeCompare(db);
  });
  
  const tbody = document.getElementById('dash-tbody');
  if(!sorted.length){
    tbody.innerHTML='<tr><td colspan="7" class="empty-state">進行中の案件はありません</td></tr>';
    return;
  }
  tbody.innerHTML = sorted.map(c=>`
    <tr>
      <td class="center"><span class="badge ${c.type==='受注'?'badge-blue':'badge-orange'}">${c.type}</span></td>
      <td class="bold">${c.name}</td>
      <td>${c.customer||'-'}</td>
      <td class="center">${c.deadline||'-'}</td>
      <td class="center">${deadlineBadge(c.deadline)}</td>
      <td>${progBar(c.pct)}</td>
      <td class="center">${statusBadge(c.pct)}</td>
    </tr>
  `).join('');
}

// ==================== 受注管理 ====================
let orderFilter = 'all';
function setOrderFilter(f, btn){
  orderFilter = f;
  document.querySelectorAll('#tab-orders .flt-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderOrders();
}

function renderOrders(){
  const tbody = document.getElementById('orders-tbody');
  let list = DB.orders||[];
  
  if(orderFilter==='done') list = list.filter(o=>calcOrderPct(o)>=100);
  else if(orderFilter==='active') list = list.filter(o=>calcOrderPct(o)<100);
  else if(orderFilter==='overdue') list = list.filter(o=>{const d=daysLeft(o.deadline);return d!==null&&d<0&&calcOrderPct(o)<100;});

  if(!list.length){
    tbody.innerHTML='<tr><td colspan="10"><div class="empty-state"><div class="icon">📋</div>受注データがありません。「＋ 新規受注登録」から追加してください</div></td></tr>';
    return;
  }
  tbody.innerHTML = list.map(o=>{
    const pct = calcOrderPct(o);
    const itemNames = (o.items||[]).map(i=>i.hinmei||i.zumen).join('、');
    return `<tr>
      <td class="bold" style="color:#1F4E79">${o.orderNo||'-'}</td>
      <td>${o.customer||'-'}</td>
      <td class="center">${o.orderDate||'-'}</td>
      <td class="center">${o.deadline||'-'}</td>
      <td class="center">${deadlineBadge(o.deadline)}</td>
      <td style="max-width:180px;font-size:11px">${itemNames||'-'}</td>
      <td class="center">${o.qty||1}</td>
      <td>${progBar(pct)}</td>
      <td class="center">${statusBadge(pct)}</td>
      <td class="center">
        <button class="btn btn-sm btn-outline" onclick="openOrderDetail('${o.id}')">詳細</button>
        <button class="btn btn-sm btn-danger" onclick="deleteOrder('${o.id}')">削除</button>
      </td>
    </tr>`;
  }).join('');
}

  };
  DB.orders.push(order);
  saveDB();
  closeOrderModal();
  renderAll();
}

function deleteOrder(id){
  if(!confirm('この受注を削除しますか？')) return;
  DB.orders = DB.orders.filter(o=>o.id!==id);
  saveDB();
  renderAll();
}

// 受注詳細モーダル
function openOrderDetail(id){
  const order = DB.orders.find(o=>o.id===id);
  if(!order) return;
  
  document.getElementById('od-title').textContent=`📋 受注詳細: ${order.orderNo}`;
  document.getElementById('od-delete-btn').onclick=()=>{
    if(confirm('削除しますか？')){ deleteOrder(id); closeDetailModal(); }
  };
  
  const info = document.getElementById('od-info');
  info.innerHTML=`
    <div><div style="font-size:10px;color:#777">客先</div><div style="font-weight:bold">${order.customer||'-'}</div></div>
    <div><div style="font-size:10px;color:#777">受注日</div><div>${order.orderDate||'-'}</div></div>
    <div><div style="font-size:10px;color:#777">目標納期</div><div style="font-weight:bold">${order.deadline||'-'}</div></div>
    <div><div style="font-size:10px;color:#777">数量</div><div>${order.qty||1} 個</div></div>
    ${order.notes?`<div style="grid-column:1/-1"><div style="font-size:10px;color:#777">備考</div><div>${order.notes}</div></div>`:''}
  `;
  
  const itemsDiv = document.getElementById('od-items');
  itemsDiv.innerHTML = (order.items||[]).map((item,ii)=>{
    const doneCount = item.stepStatuses.filter(s=>s==='完了').length;
    const pct = Math.round(doneCount/item.steps.length*100);
    return `
    <div style="border:1.5px solid #BDD7EE;border-radius:8px;padding:10px;margin-bottom:8px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div><span style="font-weight:bold;color:#1F4E79">${item.zumen}</span>
          <span style="margin-left:8px;color:#555">${item.hinmei}</span></div>
        <div>${progBar(pct)}</div>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        ${item.steps.map((step,si)=>`
          <div style="display:flex;align-items:center;gap:5px;background:#f0f4f8;padding:5px 8px;border-radius:6px">
            <span style="font-size:10px;background:#1F4E79;color:white;padding:1px 5px;border-radius:10px">${si+1}</span>
            <span style="font-size:11px;max-width:150px">${step}</span>
            <select class="st-sel ${getStClass(item.stepStatuses[si])}"
              onchange="updateOrderItemStatus('${id}',${ii},${si},this)">
              <option ${item.stepStatuses[si]==='未着手'?'selected':''}>未着手</option>
              <option ${item.stepStatuses[si]==='作業中'?'selected':''}>作業中</option>
              <option ${item.stepStatuses[si]==='完了'?'selected':''}>完了</option>
            </select>
          </div>
        `).join('')}
      </div>
    </div>`;
  }).join('');
  
  document.getElementById('order-detail-modal').classList.add('open');
}
function closeDetailModal(){ document.getElementById('order-detail-modal').classList.remove('open'); }

function getStClass(v){
  if(v==='完了') return 'st-done';
  if(v==='作業中') return 'st-inprog';
  return 'st-notyet';
}

function updateOrderItemStatus(orderId, itemIdx, stepIdx, sel){
  sel.className = 'st-sel '+getStClass(sel.value);
  const order = DB.orders.find(o=>o.id===orderId);
  order.items[itemIdx].stepStatuses[stepIdx] = sel.value;
  saveDB();
  renderOrders();
  renderDashboard();
}

// ==================== 単発案件 ====================
let oneoffFilter = 'all';
function setOneoffFilter(f,btn){
  oneoffFilter=f;
  document.querySelectorAll('#tab-oneoff .flt-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderOneoff();
}

function renderOneoff(){
  const tbody = document.getElementById('oneoff-tbody');
  let list = DB.oneoff||[];
  if(oneoffFilter==='done') list=list.filter(o=>calcOneoffPct(o)>=100);
  else if(oneoffFilter==='active') list=list.filter(o=>calcOneoffPct(o)<100);
  
  if(!list.length){
    tbody.innerHTML='<tr><td colspan="9"><div class="empty-state"><div class="icon">⚡</div>単発案件がありません。「＋ 新規単発案件登録」から追加してください</div></td></tr>';
    return;
  }
  tbody.innerHTML = list.map(oo=>{
    const pct = calcOneoffPct(oo);
    const stepsHtml = (oo.steps||[]).map((step,si)=>`
      <div style="display:inline-flex;align-items:center;gap:4px;margin:2px;background:#f0f4f8;padding:3px 6px;border-radius:4px">
        <span style="font-size:10px">${step}</span>
        <select class="st-sel ${getStClass(oo.stepStatuses[si])}" style="width:70px;font-size:10px"
          onchange="updateOneoffStatus('${oo.id}',${si},this)">
          <option ${oo.stepStatuses[si]==='未着手'?'selected':''}>未着手</option>
          <option ${oo.stepStatuses[si]==='作業中'?'selected':''}>作業中</option>
          <option ${oo.stepStatuses[si]==='完了'?'selected':''}>完了</option>
        </select>
      </div>
    `).join('');
    return `<tr>
      <td class="bold" style="color:#1F4E79">${oo.name}</td>
      <td>${oo.customer||'-'}</td>
      <td class="center">${oo.qty||1}</td>
      <td class="center">${oo.deadline||'-'}</td>
      <td class="center">${deadlineBadge(oo.deadline)}</td>
      <td><div>${stepsHtml}</div>${progBar(pct)}</td>
      <td class="center">${statusBadge(pct)}</td>
      <td style="font-size:11px;color:#666">${oo.notes||''}</td>
      <td class="center"><button class="btn btn-sm btn-danger" onclick="deleteOneoff('${oo.id}')">削除</button></td>
    </tr>`;
  }).join('');
}

function updateOneoffStatus(id, si, sel){
  sel.className='st-sel '+getStClass(sel.value);
  const oo = DB.oneoff.find(o=>o.id===id);
  oo.stepStatuses[si]=sel.value;
  saveDB();
  renderDashboard();
}

function deleteOneoff(id){
  if(!confirm('削除しますか？')) return;
  DB.oneoff=DB.oneoff.filter(o=>o.id!==id);
  saveDB();
  renderAll();
}

// 単発案件モーダル
function openOneoffModal(){
  document.getElementById('oo-name').value='';
  document.getElementById('oo-customer').value='';
  document.getElementById('oo-qty').value=1;
  document.getElementById('oo-deadline').value='';
  document.getElementById('oo-notes').value='';
  document.getElementById('oo-steps').innerHTML='';
  document.getElementById('oneoff-modal').classList.add('open');
}
function closeOneoffModal(){ document.getElementById('oneoff-modal').classList.remove('open'); }

function addOneoffStepCustom(){
  const div=document.createElement('div');
  div.className='step-row';
  const n=document.querySelectorAll('#oo-steps .step-row').length+1;
  div.innerHTML=`<div class="step-num">${n}</div>
    <input type="text" placeholder="工程名を入力 例: 溶接、メッキ処理...">
    <button class="btn btn-sm btn-danger" onclick="removeStep(this)">✕</button>`;
  document.getElementById('oo-steps').appendChild(div);
  renumberSteps();
}

function addOneoffStepFromList(){
  filterSteps('');
  document.getElementById('step-picker-modal').classList.add('open');
}

function filterSteps(q){
  const list = document.getElementById('step-list');
  const filtered = ALL_STEPS.filter(s=>s.toLowerCase().includes(q.toLowerCase()));
  list.innerHTML = filtered.map(s=>`
    <div style="padding:8px 12px;cursor:pointer;border-bottom:1px solid #f0f0f0;font-size:12px"
      onmouseover="this.style.background='#e8f0fe'" onmouseout="this.style.background=''"
      onclick="selectStep('${s.replace(/'/g,"\'")}')">
      ${s}
    </div>
  `).join('');
}

function selectStep(step){
  document.getElementById('step-picker-modal').classList.remove('open');
  const div=document.createElement('div');
  div.className='step-row';
  div.innerHTML=`<div class="step-num">?</div>
    <input type="text" value="${step}">
    <button class="btn btn-sm btn-danger" onclick="removeStep(this)">✕</button>`;
  document.getElementById('oo-steps').appendChild(div);
  renumberSteps();
}

function removeStep(btn){ btn.parentElement.remove(); renumberSteps(); }
function renumberSteps(){
  document.querySelectorAll('#oo-steps .step-num').forEach((el,i)=>el.textContent=i+1);
}

function saveOneoff(){
  const name=document.getElementById('oo-name').value.trim();
  if(!name){ alert('案件名を入力してください'); return; }
  const steps=Array.from(document.querySelectorAll('#oo-steps .step-row input'))
    .map(i=>i.value.trim()).filter(Boolean);
  const oo={
    id:uid(), name, 
    customer:document.getElementById('oo-customer').value.trim(),
    qty:parseInt(document.getElementById('oo-qty').value)||1,
    deadline:document.getElementById('oo-deadline').value,
    notes:document.getElementById('oo-notes').value.trim(),
    steps, stepStatuses:steps.map(()=>'未着手')
  };
  DB.oneoff.push(oo);
  saveDB();
  closeOneoffModal();
  renderAll();
}

// ==================== 工程マスタ ====================
let masterFilter='all';
function setMasterFilter(f,btn){
  masterFilter=f;
  document.querySelectorAll('#tab-master .flt-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderMaster();
}

function renderMaster(){
  if(!DB.masterStatus) DB.masterStatus={};
  const tbody=document.getElementById('master-tbody');
  let list=MASTER_PARTS;
  
  if(masterFilter==='done') list=list.filter(p=>{
    const ss=p.steps.map((_,si)=>DB.masterStatus[p.zumen+'_'+si]||'未着手');
    return ss.every(s=>s==='完了');
  });
  else if(masterFilter==='notyet') list=list.filter(p=>{
    const ss=p.steps.map((_,si)=>DB.masterStatus[p.zumen+'_'+si]||'未着手');
    return !ss.every(s=>s==='完了');
  });

  tbody.innerHTML=list.map((p,ri)=>{
    const MAX=4;
    let html=`<td style="font-weight:bold;color:#1F4E79;white-space:nowrap;font-size:11px">${p.zumen}</td>
              <td style="font-size:11px">${p.hinmei}</td>`;
    let zansu=0;
    for(let si=0;si<MAX;si++){
      if(si<p.steps.length){
        const key=p.zumen+'_'+si;
        const val=DB.masterStatus[key]||'未着手';
        if(val!=='完了') zansu++;
        html+=`<td style="background:#EBF3FB;font-size:11px">${p.steps[si]}</td>
               <td><select class="st-sel ${getStClass(val)}" style="width:78px"
                 onchange="updateMasterStatus('${p.zumen}',${si},this)">
                 <option ${val==='未着手'?'selected':''}>未着手</option>
                 <option ${val==='作業中'?'selected':''}>作業中</option>
                 <option ${val==='完了'?'selected':''}>完了</option>
               </select></td>`;
      } else {
        html+='<td style="background:#f5f5f5;color:#ccc;text-align:center;font-size:11px">-</td><td style="background:#f5f5f5"></td>';
      }
    }
    html+=`<td style="text-align:center;font-size:15px;font-weight:bold;color:${zansu===0?'#70AD47':'#FF6B6B'}">${zansu}</td>`;
    return `<tr>${html}</tr>`;
  }).join('');
}

function updateMasterStatus(zumen,si,sel){
  sel.className='st-sel '+getStClass(sel.value);
  if(!DB.masterStatus) DB.masterStatus={};
  DB.masterStatus[zumen+'_'+si]=sel.value;
  saveDB();
}

// ==================== データ出力 ====================
function exportData(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`seizan_backup_${today()}.json`;
  a.click();
}

// ==================== 初期化 ====================
function renderAll(){
  renderDashboard();
  renderOrders();
  renderOneoff();
  renderMaster();
}

// 日付表示
const now=new Date();
document.getElementById('hdr-date').textContent=
  `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日`;

renderAll();
</script>
