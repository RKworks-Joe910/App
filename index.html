<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIFE QUEST — 日常経験値システム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #10162a;
    --panel: #1a2340;
    --panel-2: #141b34;
    --border: #4a63b8;
    --gold: #ffcc4d;
    --text: #eef1ff;
    --dim: #8b93c4;
    --hp: #ff5d73;
    --good: #5ee7a8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DotGothic16', 'MS Gothic', monospace;
    min-height: 100vh;
  }
  body {
    display: flex; justify-content: center;
    padding: 20px 12px 100px;
  }
  #app { width: 100%; max-width: 720px; display: flex; flex-direction: column; gap: 16px; }

  .rpg-panel {
    background: var(--panel);
    border: 3px solid var(--border);
    border-radius: 6px;
    box-shadow: inset 0 0 0 2px #000, 0 4px 0 rgba(0,0,0,0.35);
    padding: 14px 16px;
  }

  /* Header */
  #header { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  #header .name-row { display: flex; align-items: baseline; gap: 10px; }
  #hero-name {
    background: transparent; border: none; color: var(--gold);
    font-family: inherit; font-size: 20px; letter-spacing: 2px;
    border-bottom: 1px dashed transparent;
  }
  #hero-name:focus { outline: none; border-bottom: 1px dashed var(--gold); }
  .lv-badge { font-size: 14px; color: var(--text); }
  .lv-badge b { color: var(--gold); font-size: 18px; }
  #streak { font-size: 12px; color: var(--good); text-align: right; }
  #streak b { font-size: 16px; }

  /* Stats grid */
  #stats-title, #quests-title, #log-title, #cal-title {
    color: var(--gold); font-size: 13px; letter-spacing: 3px; margin-bottom: 10px;
  }
  #stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap: 10px; }
  .stat-card {
    background: var(--panel-2); border: 2px solid var(--border); border-radius: 5px;
    padding: 10px 12px;
  }
  .stat-card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .stat-name { font-size: 14px; }
  .stat-icon { margin-right: 6px; }
  .stat-lv { font-size: 12px; color: var(--dim); }
  .stat-lv b { color: var(--gold); font-size: 14px; }
  .bar-track { background: #05070f; border: 1px solid var(--border); border-radius: 3px; height: 10px; overflow: hidden; }
  .bar-fill { height: 100%; background: linear-gradient(90deg,#4a9dff,#5ee7a8); transition: width .4s ease; }
  .stat-xp-label { font-size: 10px; color: var(--dim); margin-top: 4px; text-align: right; }
  .stat-del { background:none;border:none;color:var(--dim);font-size:11px;cursor:pointer; }
  .stat-del:hover { color: var(--hp); }

  #add-stat-row { display:flex; gap:8px; margin-top:12px; flex-wrap: wrap; }

  /* Quest list */
  .quest-row {
    display: flex; align-items: center; gap: 10px;
    background: var(--panel-2); border: 2px solid var(--border); border-radius: 5px;
    padding: 8px 12px; margin-bottom: 8px;
  }
  .quest-row.done { opacity: 0.55; }
  .quest-main { flex: 1; min-width: 0; }
  .quest-name { font-size: 14px; }
  .quest-meta { font-size: 11px; color: var(--dim); margin-top: 2px; }
  .btn {
    font-family: inherit; cursor: pointer; border-radius: 4px;
    border: 2px solid var(--border); background: var(--panel); color: var(--text);
    padding: 8px 14px; font-size: 12px; letter-spacing: 1px; transition: all .15s;
  }
  .btn:hover { border-color: var(--gold); color: var(--gold); }
  .btn.done-btn { border-color: var(--good); color: var(--good); }
  .btn.small { padding: 5px 10px; font-size: 11px; }
  .btn.danger:hover { border-color: var(--hp); color: var(--hp); }
  .btn.primary { border-color: var(--gold); color: var(--gold); }

  input, select {
    font-family: inherit; background: #05070f; color: var(--text);
    border: 2px solid var(--border); border-radius: 4px; padding: 7px 9px; font-size: 12px;
  }
  input[type=number] { width: 70px; }

  #new-quest-form { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  #new-quest-form input[name=qname] { flex: 1; min-width: 140px; }

  /* Message log (RPG dialogue box) */
  #msg-box {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
    width: min(720px, 94vw);
    background: var(--panel); border: 3px solid var(--gold); border-radius: 6px;
    box-shadow: inset 0 0 0 2px #000, 0 4px 12px rgba(0,0,0,0.5);
    padding: 10px 16px; min-height: 44px; z-index: 30;
    font-size: 13px; line-height: 1.6;
  }
  #msg-box .line { opacity: 0; animation: fadein .3s forwards; }
  @keyframes fadein { to { opacity: 1; } }

  /* Calendar heatmap */
  #cal-grid { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 12px); gap: 3px; overflow-x: auto; padding-bottom: 4px; }
  .cal-cell { width: 12px; height: 12px; border-radius: 2px; background: #202a4d; }
  .cal-cell[data-lv="1"] { background: #2c5c4a; }
  .cal-cell[data-lv="2"] { background: #2f8f66; }
  .cal-cell[data-lv="3"] { background: #3fc987; }
  .cal-cell[data-lv="4"] { background: #5ee7a8; }
  .cal-cell.today { outline: 1px solid var(--gold); }

  /* Level up modal */
  #levelup-overlay {
    position: fixed; inset: 0; background: rgba(4,6,16,0.85);
    display: none; align-items: center; justify-content: center; z-index: 50;
  }
  #levelup-overlay.show { display: flex; }
  #levelup-card {
    background: var(--panel); border: 3px solid var(--gold); border-radius: 8px;
    padding: 30px 40px; text-align: center; box-shadow: 0 0 40px #ffcc4d55;
    animation: pop .35s ease;
  }
  @keyframes pop { from { transform: scale(0.7); opacity:0; } to { transform: scale(1); opacity:1; } }
  #levelup-card h2 { color: var(--gold); font-size: 24px; letter-spacing: 4px; margin-bottom: 14px; }
  #levelup-card p { font-size: 15px; margin: 6px 0; }
  #levelup-card .stat-up { color: var(--good); font-size: 18px; margin: 10px 0; }

  #reset-row { text-align: right; }
  #reset-row .btn { font-size: 10px; opacity: 0.5; }

  ::placeholder { color: var(--dim); opacity: 0.7; }
</style>
</head>
<body>

<div id="app">

  <div class="rpg-panel" id="header">
    <div class="name-row">
      <input id="hero-name" value="ゆうしゃ" maxlength="12">
      <span class="lv-badge">冒険者 Lv. <b id="hero-lv">1</b></span>
    </div>
    <div id="streak">連続達成 <b id="streak-days">0</b> 日</div>
  </div>

  <div class="rpg-panel">
    <div id="stats-title">◆ ステータス</div>
    <div id="stats-grid"></div>
    <div id="add-stat-row">
      <input id="new-stat-name" placeholder="新しいステータス名（例: 語学）" maxlength="10">
      <button class="btn primary" id="add-stat-btn">＋ ステータス追加</button>
    </div>
  </div>

  <div class="rpg-panel">
    <div id="quests-title">◆ 今日のクエスト</div>
    <div id="quest-list"></div>
    <div id="new-quest-form">
      <input type="text" name="qname" placeholder="クエスト名（例: 筋トレ30分）" maxlength="20">
      <select name="qcat" id="qcat-select"></select>
      <input type="number" name="qxp" value="10" min="1" max="999">
      <button class="btn primary" id="add-quest-btn">＋ クエスト登録</button>
    </div>
  </div>

  <div class="rpg-panel">
    <div id="cal-title">◆ 冒険の記録</div>
    <div id="cal-grid"></div>
  </div>

  <div id="reset-row">
    <button class="btn danger" id="reset-btn">最初からやり直す</button>
  </div>

</div>

<div id="msg-box"><div class="line" id="msg-line">冒険の書を読み込みました。</div></div>

<div id="levelup-overlay">
  <div id="levelup-card">
    <h2>LEVEL UP!</h2>
    <p id="levelup-cat"></p>
    <p class="stat-up" id="levelup-detail"></p>
    <button class="btn primary" id="levelup-close">つづける</button>
  </div>
</div>

<script>
const STORE_KEY = 'lifequest_save_v1';

const DEFAULT_STATE = () => ({
  heroName: 'ゆうしゃ',
  stats: [
    { id: 'study',  name: '勉強',  icon: '📖', xp: 0 },
    { id: 'train',  name: '筋トレ', icon: '💪', xp: 0 },
    { id: 'meal',   name: '食事',  icon: '🍚', xp: 0 },
    { id: 'work',   name: '作業',  icon: '🛠️', xp: 0 },
  ],
  quests: [
    { id: uid(), name: '参考書を1章読む', catId: 'study', xp: 15 },
    { id: uid(), name: '筋トレ30分',      catId: 'train', xp: 15 },
    { id: uid(), name: '野菜を食べる',    catId: 'meal',  xp: 8  },
    { id: uid(), name: 'タスクを1つ片付ける', catId: 'work', xp: 10 },
  ],
  // date string (YYYY-MM-DD) -> { questId: true, ... }
  completions: {},
  // date string -> total xp earned that day (for heatmap)
  dailyXp: {},
});

function uid() { return Math.random().toString(36).slice(2, 10); }
function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return DEFAULT_STATE();
    const parsed = JSON.parse(raw);
    if (!parsed.stats || !parsed.quests) return DEFAULT_STATE();
    return parsed;
  } catch (e) { return DEFAULT_STATE(); }
}
function saveState() { localStorage.setItem(STORE_KEY, JSON.stringify(state)); }

let state = loadState();

// ---- Leveling formula (DQ-ish curve) ----
function xpToNext(level) { return Math.round(15 + level * 10 + Math.pow(level, 1.6)); }
function levelInfo(totalXp) {
  let level = 1, remaining = totalXp;
  while (remaining >= xpToNext(level)) {
    remaining -= xpToNext(level);
    level++;
  }
  return { level, into: remaining, need: xpToNext(level) };
}

// ---- Message log ----
let msgQueue = [];
let msgTimer = null;
function pushMessage(text) {
  msgQueue.push(text);
  if (!msgTimer) drainMessages();
}
function drainMessages() {
  const el = document.getElementById('msg-line');
  if (msgQueue.length === 0) { msgTimer = null; return; }
  const text = msgQueue.shift();
  el.textContent = text;
  el.style.animation = 'none';
  void el.offsetWidth;
  el.style.animation = '';
  msgTimer = setTimeout(drainMessages, 1700);
}

// ---- Level up modal ----
function showLevelUp(catName, newLevel) {
  document.getElementById('levelup-cat').textContent = `『${catName}』が Lv.${newLevel} になった！`;
  document.getElementById('levelup-detail').textContent = 'つぎのステップへ すすもう！';
  document.getElementById('levelup-overlay').classList.add('show');
}
document.getElementById('levelup-close').addEventListener('click', () => {
  document.getElementById('levelup-overlay').classList.remove('show');
});

// ---- Rendering ----
function render() {
  document.getElementById('hero-name').value = state.heroName;

  // overall hero level = sum of stat levels
  let heroLevelSum = 0;
  const statsGrid = document.getElementById('stats-grid');
  statsGrid.innerHTML = '';
  state.stats.forEach(stat => {
    const info = levelInfo(stat.xp);
    heroLevelSum += info.level;
    const pct = Math.min(100, Math.round((info.into / info.need) * 100));
    const card = document.createElement('div');
    card.className = 'stat-card';
    card.innerHTML = `
      <div class="stat-card-top">
        <span class="stat-name"><span class="stat-icon">${stat.icon}</span>${escapeHtml(stat.name)}</span>
        <span class="stat-lv">Lv. <b>${info.level}</b></span>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
      <div class="stat-xp-label">${info.into} / ${info.need} XP
        <button class="stat-del" data-id="${stat.id}" title="削除">✕</button>
      </div>
    `;
    statsGrid.appendChild(card);
  });
  document.getElementById('hero-lv').textContent = heroLevelSum;

  statsGrid.querySelectorAll('.stat-del').forEach(btn => {
    btn.addEventListener('click', () => deleteStat(btn.dataset.id));
  });

  // quest category select
  const sel = document.getElementById('qcat-select');
  sel.innerHTML = state.stats.map(s => `<option value="${s.id}">${s.icon} ${escapeHtml(s.name)}</option>`).join('');

  // quest list
  const today = todayStr();
  const doneToday = state.completions[today] || {};
  const list = document.getElementById('quest-list');
  list.innerHTML = '';
  state.quests.forEach(q => {
    const cat = state.stats.find(s => s.id === q.catId);
    const isDone = !!doneToday[q.id];
    const row = document.createElement('div');
    row.className = 'quest-row' + (isDone ? ' done' : '');
    row.innerHTML = `
      <div class="quest-main">
        <div class="quest-name">${cat ? cat.icon : '❔'} ${escapeHtml(q.name)}</div>
        <div class="quest-meta">${cat ? escapeHtml(cat.name) : '（カテゴリ削除済み）'} ・ XP +${q.xp}</div>
      </div>
      <button class="btn small danger" data-del="${q.id}">削除</button>
      <button class="btn small ${isDone ? 'done-btn' : ''}" data-toggle="${q.id}">${isDone ? '達成済み ✓' : '達成する'}</button>
    `;
    list.appendChild(row);
  });
  list.querySelectorAll('[data-toggle]').forEach(btn => {
    btn.addEventListener('click', () => toggleQuest(btn.dataset.toggle));
  });
  list.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', () => deleteQuest(btn.dataset.del));
  });

  renderStreak();
  renderCalendar();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderStreak() {
  let streak = 0;
  let d = new Date();
  // if today has no xp yet, still allow counting from yesterday backward,
  // but if today has activity, count today too.
  const today = todayStr();
  if ((state.dailyXp[today] || 0) > 0) {
    streak = 1;
    d.setDate(d.getDate() - 1);
  } else {
    d.setDate(d.getDate() - 1);
  }
  while (true) {
    const key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    if ((state.dailyXp[key] || 0) > 0) {
      streak++;
      d.setDate(d.getDate() - 1);
    } else break;
  }
  document.getElementById('streak-days').textContent = streak;
}

function renderCalendar() {
  const grid = document.getElementById('cal-grid');
  grid.innerHTML = '';
  const days = 84; // 12 weeks
  const today = new Date();
  const cells = [];
  for (let i = days - 1; i >= 0; i--) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    const key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    const xp = state.dailyXp[key] || 0;
    let lv = 0;
    if (xp > 0) lv = 1;
    if (xp >= 15) lv = 2;
    if (xp >= 30) lv = 3;
    if (xp >= 50) lv = 4;
    cells.push({ key, lv, isToday: key === todayStr() });
  }
  cells.forEach(c => {
    const cell = document.createElement('div');
    cell.className = 'cal-cell' + (c.isToday ? ' today' : '');
    cell.dataset.lv = c.lv;
    cell.title = `${c.key}`;
    grid.appendChild(cell);
  });
}

// ---- Actions ----
function toggleQuest(questId) {
  const q = state.quests.find(x => x.id === questId);
  if (!q) return;
  const cat = state.stats.find(s => s.id === q.catId);
  const today = todayStr();
  if (!state.completions[today]) state.completions[today] = {};
  const doneToday = state.completions[today];

  if (doneToday[questId]) {
    // undo
    delete doneToday[questId];
    if (cat) cat.xp = Math.max(0, cat.xp - q.xp);
    state.dailyXp[today] = Math.max(0, (state.dailyXp[today] || 0) - q.xp);
    pushMessage(`『${q.name}』の達成を取り消した。`);
    saveState();
    render();
    return;
  }

  const beforeLevel = cat ? levelInfo(cat.xp).level : 0;
  doneToday[questId] = true;
  if (cat) cat.xp += q.xp;
  state.dailyXp[today] = (state.dailyXp[today] || 0) + q.xp;
  saveState();

  pushMessage(`『${q.name}』を達成！ ${cat ? cat.name : ''}の経験値 +${q.xp}`);

  if (cat) {
    const afterLevel = levelInfo(cat.xp).level;
    if (afterLevel > beforeLevel) {
      setTimeout(() => showLevelUp(cat.name, afterLevel), 400);
    }
  }
  render();
}

function deleteQuest(questId) {
  state.quests = state.quests.filter(q => q.id !== questId);
  saveState();
  render();
}

function deleteStat(statId) {
  const stat = state.stats.find(s => s.id === statId);
  if (!stat) return;
  if (!confirm(`ステータス「${stat.name}」を削除しますか？（このステータスに紐づくクエストは残りますが経験値は入らなくなります）`)) return;
  state.stats = state.stats.filter(s => s.id !== statId);
  saveState();
  render();
}

document.getElementById('add-stat-btn').addEventListener('click', () => {
  const input = document.getElementById('new-stat-name');
  const name = input.value.trim();
  if (!name) return;
  state.stats.push({ id: uid(), name, icon: '⭐', xp: 0 });
  input.value = '';
  saveState();
  render();
});
document.getElementById('new-stat-name').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('add-stat-btn').click();
});

document.getElementById('add-quest-btn').addEventListener('click', () => {
  const form = document.getElementById('new-quest-form');
  const name = form.querySelector('[name=qname]').value.trim();
  const catId = form.querySelector('[name=qcat]').value;
  const xp = Math.max(1, parseInt(form.querySelector('[name=qxp]').value, 10) || 10);
  if (!name || !catId) return;
  state.quests.push({ id: uid(), name, catId, xp });
  form.querySelector('[name=qname]').value = '';
  saveState();
  render();
});

document.getElementById('hero-name').addEventListener('input', e => {
  state.heroName = e.target.value;
  saveState();
});

document.getElementById('reset-btn').addEventListener('click', () => {
  if (!confirm('本当に最初からやり直しますか？すべてのデータが削除されます。')) return;
  state = DEFAULT_STATE();
  saveState();
  render();
  pushMessage('冒険をはじめからやりなおした。');
});

render();
</script>

</body>
</html>
