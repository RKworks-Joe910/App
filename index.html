<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEON SYNC — CG MV Engine</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; font-family: 'Courier New', monospace; }
    canvas { display: block; }

    /* CRT scanlines overlay */
    .scanlines {
      position: fixed; inset: 0; pointer-events: none; z-index: 10;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 2px, rgba(0,0,0,0.06) 2px, rgba(0,0,0,0.06) 4px
      );
    }

    /* HUD: title */
    #hud {
      position: fixed; top: 24px; left: 24px; z-index: 20; color: #0ff;
      user-select: none; pointer-events: none;
    }
    #hud h1 {
      font-size: 22px; letter-spacing: 8px; font-weight: 400;
      text-shadow: 0 0 10px #0ff, 0 0 30px #0ff5;
      animation: glitch 9s infinite;
    }
    #hud .sub { font-size: 10px; letter-spacing: 4px; opacity: 0.45; margin-top: 5px; }

    @keyframes glitch {
      0%,93%,100% { clip-path: none; transform: none; }
      94% { clip-path: inset(38% 0 44% 0); transform: translate(-4px,0); }
      95% { clip-path: inset(18% 0 62% 0); transform: translate(4px,0); }
      96% { clip-path: inset(68% 0 12% 0); transform: translate(-2px,0); }
      97% { clip-path: none; transform: none; }
    }

    /* HUD: VU meter */
    #vu {
      position: fixed; top: 24px; right: 24px; z-index: 20;
      color: #0ff; text-align: right; user-select: none;
    }
    #vu .label { font-size: 10px; letter-spacing: 3px; opacity: 0.45; }
    #vu-bars { display: flex; gap: 3px; margin-top: 8px; justify-content: flex-end; align-items: flex-end; height: 42px; }
    .vu-bar { width: 5px; min-height: 2px; background: #003344; transition: height 0.05s; }

    /* Controls bar */
    #controls {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 10px; z-index: 20;
    }
    button {
      background: rgba(0,255,255,0.04); border: 1px solid rgba(0,255,255,0.3);
      color: rgba(0,255,255,0.7); padding: 9px 20px; cursor: pointer;
      font-family: inherit; font-size: 11px; letter-spacing: 2px;
      text-transform: uppercase; transition: all 0.2s; outline: none;
    }
    button:hover { border-color: #0ff; color: #0ff; box-shadow: 0 0 14px #0ff4; }
    button.active { border-color: #ff00ff; color: #ff00ff; box-shadow: 0 0 12px #f0f4; }
    button.rec-on  { border-color: #f44; color: #f44; box-shadow: 0 0 12px #f444; }

    /* Drop hint */
    #hint {
      position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%);
      font-size: 10px; letter-spacing: 2px; color: rgba(0,255,255,0.35);
      pointer-events: none; white-space: nowrap;
    }

    #file-input { display: none; }
  </style>
</head>
<body>
  <div class="scanlines"></div>

  <div id="hud">
    <h1>NEON SYNC</h1>
    <div class="sub">CG MV ENGINE / CYBERPUNK EDITION</div>
  </div>

  <div id="vu">
    <div class="label">AUDIO SYNC</div>
    <div id="vu-bars"></div>
  </div>

  <div id="hint">音楽ファイルをドロップ、または [LOAD MUSIC] で読み込み</div>

  <div id="controls">
    <button id="btn-auto" onclick="toggleAuto()" class="active">◈ AUTO</button>
    <button onclick="document.getElementById('file-input').click()">♫ LOAD MUSIC</button>
    <button id="btn-rec" onclick="toggleRecord()">● REC</button>
  </div>
  <input type="file" id="file-input" accept="audio/*" onchange="loadMusicFile(event)">

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass }     from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    // ── RENDERER ──────────────────────────────────────────────────────────────
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.9;
    document.body.prepend(renderer.domElement);

    // ── SCENE / CAMERA ────────────────────────────────────────────────────────
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000008);
    scene.fog = new THREE.FogExp2(0x000008, 0.038);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 3.2, 9);
    camera.lookAt(0, 1.8, 0);

    // ── POST PROCESSING ───────────────────────────────────────────────────────
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloom = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight), 1.8, 0.5, 0.72
    );
    composer.addPass(bloom);

    // ── LIGHTS ────────────────────────────────────────────────────────────────
    scene.add(new THREE.AmbientLight(0x050514, 4));

    const cyanLight    = new THREE.PointLight(0x00ccff, 5, 22);
    cyanLight.position.set(-4, 5, 2);
    scene.add(cyanLight);

    const magentaLight = new THREE.PointLight(0xff0088, 4, 20);
    magentaLight.position.set(4, 4, -3);
    scene.add(magentaLight);

    const rimLight = new THREE.PointLight(0x0033ff, 3, 14);
    rimLight.position.set(0, 1, -5);
    scene.add(rimLight);

    // ── NEON GRID ─────────────────────────────────────────────────────────────
    function makeGrid() {
      const g = new THREE.Group();
      const S = 22, N = 26;

      for (let i = 0; i <= N; i++) {
        const z = -S + (i / N) * S * 2;
        const a = 1 - Math.abs(i / N - 0.5) * 1.8;
        if (a <= 0) continue;
        const geo = new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(-S, 0, z), new THREE.Vector3(S, 0, z)
        ]);
        g.add(new THREE.Line(geo, new THREE.LineBasicMaterial({
          color: i % 5 === 0 ? 0x006688 : 0x002233,
          transparent: true, opacity: a * 0.85
        })));
      }

      for (let i = 0; i <= N; i++) {
        const x = -S + (i / N) * S * 2;
        const a = 1 - Math.abs(i / N - 0.5) * 1.5;
        if (a <= 0) continue;
        const geo = new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(x, 0, S), new THREE.Vector3(x, 0, -S)
        ]);
        g.add(new THREE.Line(geo, new THREE.LineBasicMaterial({
          color: i % 5 === 0 ? 0x006688 : 0x002233,
          transparent: true, opacity: a * 0.65
        })));
      }

      // Horizon accent line
      const hGeo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(-S, 0, -S), new THREE.Vector3(S, 0, -S)
      ]);
      g.add(new THREE.Line(hGeo, new THREE.LineBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.5 })));

      return g;
    }
    scene.add(makeGrid());

    // ── SKELETON CHARACTER ────────────────────────────────────────────────────
    function makeCharacter() {
      const g = new THREE.Group();

      // Joint positions (Y=0 is floor)
      const J = {
        head:  [ 0,    3.85, 0   ],
        neck:  [ 0,    3.3,  0   ],
        lSho:  [-0.58, 3.1,  0   ],
        rSho:  [ 0.58, 3.1,  0   ],
        lElb:  [-0.98, 2.5,  0.1 ],
        rElb:  [ 0.98, 2.5,  0.1 ],
        lWri:  [-1.05, 1.82, 0.16],
        rWri:  [ 1.05, 1.82, 0.16],
        spine: [ 0,    2.8,  0   ],
        hip:   [ 0,    2.25, 0   ],
        lHip:  [-0.28, 2.05, 0   ],
        rHip:  [ 0.28, 2.05, 0   ],
        lKne:  [-0.32, 1.25, 0.05],
        rKne:  [ 0.32, 1.25, 0.05],
        lAnk:  [-0.3,  0.28, 0.1 ],
        rAnk:  [ 0.3,  0.28, 0.1 ],
      };

      const BONES = [
        ['head','neck'], ['neck','spine'], ['spine','hip'],
        ['neck','lSho'], ['neck','rSho'],
        ['lSho','lElb'], ['rSho','rElb'],
        ['lElb','lWri'], ['rElb','rWri'],
        ['hip','lHip'],  ['hip','rHip'],
        ['lHip','lKne'], ['rHip','rKne'],
        ['lKne','lAnk'], ['rKne','rAnk'],
      ];

      const bMat = new THREE.LineBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.9 });

      BONES.forEach(([a, b]) => {
        const geo = new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(...J[a]), new THREE.Vector3(...J[b])
        ]);
        g.add(new THREE.Line(geo, bMat.clone()));
      });

      // Joint spheres
      const jGeo = new THREE.SphereGeometry(0.04, 8, 6);
      const jMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
      Object.values(J).forEach(pos => {
        const m = new THREE.Mesh(jGeo, jMat.clone());
        m.position.set(...pos);
        g.add(m);
      });

      // Head: glowing wireframe icosahedron
      const headGeo = new THREE.IcosahedronGeometry(0.22, 1);
      const headMesh = new THREE.Mesh(headGeo, new THREE.MeshBasicMaterial({
        color: 0x00ffff, wireframe: true
      }));
      headMesh.position.set(...J.head);
      g.add(headMesh);
      g._head = headMesh;

      // Chest outline ellipse
      const cPts = [];
      for (let i = 0; i <= 48; i++) {
        const a = (i / 48) * Math.PI * 2;
        cPts.push(new THREE.Vector3(Math.cos(a) * 0.38, 2.7 + Math.sin(a) * 0.28, 0));
      }
      g.add(new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(cPts),
        new THREE.LineBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.6 })
      ));

      // Hip outline
      const hPts = [];
      for (let i = 0; i <= 48; i++) {
        const a = (i / 48) * Math.PI * 2;
        hPts.push(new THREE.Vector3(Math.cos(a) * 0.26, 2.25 + Math.sin(a) * 0.12, 0));
      }
      g.add(new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(hPts),
        new THREE.LineBasicMaterial({ color: 0x0088ff, transparent: true, opacity: 0.5 })
      ));

      return g;
    }

    const character = makeCharacter();
    scene.add(character);

    // ── ORBIT RINGS ───────────────────────────────────────────────────────────
    function makeRing(radius, tubeR, color, tiltX, tiltZ) {
      const geo = new THREE.TorusGeometry(radius, tubeR, 4, 80);
      const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.35 });
      const m = new THREE.Mesh(geo, mat);
      m.position.set(0, 2.0, 0);
      m.rotation.x = tiltX;
      m.rotation.z = tiltZ;
      return m;
    }

    const ring1 = makeRing(1.6, 0.008, 0x0044ff, Math.PI / 5, 0.3);
    const ring2 = makeRing(2.0, 0.006, 0xff00aa, Math.PI / 3, -0.4);
    const ring3 = makeRing(1.3, 0.005, 0x00ffaa, Math.PI / 2.2, 0.8);
    scene.add(ring1, ring2, ring3);

    // ── SCAN PLANE (vertical sweep) ───────────────────────────────────────────
    const scanGeo = new THREE.PlaneGeometry(2.8, 0.025);
    const scanMat = new THREE.MeshBasicMaterial({
      color: 0x00ffff, transparent: true, opacity: 0.5,
      blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide
    });
    const scanPlane = new THREE.Mesh(scanGeo, scanMat);
    scanPlane.rotation.x = -Math.PI / 2;
    scene.add(scanPlane);

    // ── PARTICLES ─────────────────────────────────────────────────────────────
    const PC = 1800;
    const pPos = new Float32Array(PC * 3);
    const pVel = new Float32Array(PC * 3);
    const pCol = new Float32Array(PC * 3);

    for (let i = 0; i < PC; i++) {
      pPos[i*3]   = (Math.random() - 0.5) * 18;
      pPos[i*3+1] = Math.random() * 9;
      pPos[i*3+2] = (Math.random() - 0.5) * 18;
      pVel[i*3]   = (Math.random() - 0.5) * 0.007;
      pVel[i*3+1] = (Math.random() - 0.5) * 0.004 + 0.001;
      pVel[i*3+2] = (Math.random() - 0.5) * 0.007;

      const t = Math.random();
      pCol[i*3]   = t > 0.65 ? 1 : 0;
      pCol[i*3+1] = t < 0.35 ? 1 : (t > 0.65 ? 0 : t * 0.8);
      pCol[i*3+2] = 1;
    }

    const pGeo = new THREE.BufferGeometry();
    pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
    pGeo.setAttribute('color',    new THREE.BufferAttribute(pCol, 3));
    scene.add(new THREE.Points(pGeo, new THREE.PointsMaterial({
      size: 0.07, vertexColors: true,
      transparent: true, opacity: 0.8,
      blending: THREE.AdditiveBlending, depthWrite: false
    })));

    // Stars
    const SC = 2500;
    const sPos = new Float32Array(SC * 3);
    for (let i = 0; i < SC; i++) {
      const a = Math.random() * Math.PI * 2;
      const b = Math.acos(2 * Math.random() - 1);
      const r = 45 + Math.random() * 15;
      sPos[i*3]   = r * Math.sin(b) * Math.cos(a);
      sPos[i*3+1] = r * Math.sin(b) * Math.sin(a);
      sPos[i*3+2] = r * Math.cos(b);
    }
    const sGeo = new THREE.BufferGeometry();
    sGeo.setAttribute('position', new THREE.BufferAttribute(sPos, 3));
    scene.add(new THREE.Points(sGeo, new THREE.PointsMaterial({
      color: 0xaaccff, size: 0.12, transparent: true, opacity: 0.45
    })));

    // ── VU METER UI ───────────────────────────────────────────────────────────
    const VU_N = 16;
    const vuBars = [];
    const vuContainer = document.getElementById('vu-bars');
    for (let i = 0; i < VU_N; i++) {
      const bar = document.createElement('div');
      bar.className = 'vu-bar';
      bar.style.height = '2px';
      vuContainer.appendChild(bar);
      vuBars.push(bar);
    }

    // ── AUDIO ─────────────────────────────────────────────────────────────────
    let audioCtx, analyser, fftData, audioSrc;

    window.loadMusicFile = async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser  = audioCtx.createAnalyser();
        analyser.fftSize = 512;
        fftData   = new Uint8Array(analyser.frequencyBinCount);
        analyser.connect(audioCtx.destination);
      }

      if (audioSrc) { try { audioSrc.stop(); } catch (_) {} audioSrc.disconnect(); }

      const buf  = await audioCtx.decodeAudioData(await file.arrayBuffer());
      audioSrc = audioCtx.createBufferSource();
      audioSrc.buffer = buf;
      audioSrc.loop   = true;
      audioSrc.connect(analyser);
      audioSrc.start();

      document.getElementById('hint').textContent = `♪  ${file.name}`;
      setAutoMode(false);
    };

    document.addEventListener('dragover', e => e.preventDefault());
    document.addEventListener('drop', async e => {
      e.preventDefault();
      const f = e.dataTransfer.files[0];
      if (f?.type.startsWith('audio/')) loadMusicFile({ target: { files: [f] } });
    });

    // ── AUTO MODE ─────────────────────────────────────────────────────────────
    let autoMode = true;
    let autoT    = 0;

    function setAutoMode(on) {
      autoMode = on;
      document.getElementById('btn-auto').classList.toggle('active', on);
    }
    window.toggleAuto = () => setAutoMode(!autoMode);

    function avg(arr, s, e) {
      let sum = 0;
      for (let i = s; i < e; i++) sum += arr[i];
      return sum / (e - s);
    }

    function getLevel() {
      if (analyser && fftData) {
        analyser.getByteFrequencyData(fftData);
        const bins = analyser.frequencyBinCount;
        const bass = avg(fftData, 0,                    Math.floor(bins * 0.05)) / 255;
        const mid  = avg(fftData, Math.floor(bins*0.05), Math.floor(bins * 0.25)) / 255;
        const high = avg(fftData, Math.floor(bins*0.25), Math.floor(bins * 0.60)) / 255;
        for (let i = 0; i < VU_N; i++) {
          const v = fftData[Math.floor(i * bins / VU_N)] / 255;
          vuBars[i].style.height = (v * 40 + 2) + 'px';
          vuBars[i].style.background = v > 0.7 ? '#ff00ff' : v > 0.35 ? '#00bbff' : '#003344';
        }
        return { bass, mid, high };
      }

      if (autoMode) {
        autoT += 0.016;
        const bass = Math.pow(Math.max(0, Math.sin(autoT * 2.2)), 4) * 0.85;
        const mid  = (Math.sin(autoT * 3.8 + 0.6) * 0.5 + 0.5) * 0.55;
        const high = (Math.sin(autoT * 6.3 + 1.3) * 0.5 + 0.5) * 0.38;
        for (let i = 0; i < VU_N; i++) {
          const v = (Math.sin(autoT * (i * 0.8 + 1.5)) * 0.5 + 0.5) * 0.75;
          vuBars[i].style.height = (v * 36 + 2) + 'px';
          vuBars[i].style.background = v > 0.62 ? '#ff00ff' : v > 0.3 ? '#00bbff' : '#003344';
        }
        return { bass, mid, high };
      }

      return { bass: 0, mid: 0, high: 0 };
    }

    // ── RECORDING ─────────────────────────────────────────────────────────────
    let recorder, recChunks = [], recording = false;

    window.toggleRecord = () => {
      const btn = document.getElementById('btn-rec');
      if (!recording) {
        recChunks = [];
        const stream = renderer.domElement.captureStream(30);
        const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp9')
          ? 'video/webm;codecs=vp9' : 'video/webm';
        recorder = new MediaRecorder(stream, { mimeType });
        recorder.ondataavailable = e => recChunks.push(e.data);
        recorder.onstop = () => {
          const blob = new Blob(recChunks, { type: 'video/webm' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'neon-sync-mv.webm';
          a.click();
        };
        recorder.start();
        recording = true;
        btn.textContent = '■ STOP REC';
        btn.classList.add('rec-on');
      } else {
        recorder.stop();
        recording = false;
        btn.textContent = '● REC';
        btn.classList.remove('rec-on');
      }
    };

    // ── ANIMATION LOOP ────────────────────────────────────────────────────────
    let t = 0, camAngle = 0;

    function animate() {
      requestAnimationFrame(animate);
      t += 0.01;

      const { bass, mid, high } = getLevel();

      // Camera slow orbit + breathing
      camAngle += 0.004;
      const camR = 9 - bass * 1.4;
      camera.position.x = Math.sin(camAngle) * camR;
      camera.position.z = Math.cos(camAngle) * camR;
      camera.position.y = 3.2 + Math.sin(t * 0.38) * 0.35 + bass * 0.25;
      camera.lookAt(0, 1.8, 0);

      // Camera shake on heavy bass
      if (bass > 0.55) {
        camera.position.x += (Math.random() - 0.5) * bass * 0.09;
        camera.position.y += (Math.random() - 0.5) * bass * 0.07;
      }

      // Character float & breathe
      character.position.y = Math.sin(t * 1.15) * 0.045;
      character.rotation.y = Math.sin(t * 0.28) * 0.09;
      if (character._head) {
        character._head.rotation.y += 0.012;
        character._head.rotation.x = Math.sin(t * 0.65) * 0.12;
      }

      // Bone brightness with audio mid
      character.traverse(c => {
        if (c.isLine && c.material) c.material.opacity = 0.65 + mid * 0.6;
        if (c.isMesh && c.material?.isMeshBasicMaterial && !c.material.wireframe)
          c.material.color.setHSL(0.53 + mid * 0.08, 1, 0.48 + high * 0.28);
      });

      // Orbit rings
      ring1.rotation.y += 0.008 + bass * 0.03;
      ring2.rotation.y -= 0.005 + mid * 0.02;
      ring3.rotation.y += 0.011 + high * 0.04;
      ring1.scale.setScalar(1 + bass * 0.08);

      // Vertical scan sweep
      scanPlane.position.set(0, ((t * 0.55) % 4.2), 0);
      scanMat.opacity = 0.3 + bass * 0.55;

      // Bloom pulse
      bloom.strength = 1.6 + bass * 2.6 + mid * 0.7;

      // Lights throb
      cyanLight.intensity    = 5 + bass * 7;
      magentaLight.intensity = 4 + mid * 6;
      cyanLight.position.x    = Math.sin(t * 0.58) * 5 - 2;
      magentaLight.position.x = Math.cos(t * 0.47) * 5 + 2;

      // Particles drift
      const pos = pGeo.attributes.position.array;
      for (let i = 0; i < PC; i++) {
        pos[i*3]   += pVel[i*3]   * (1 + high * 4.5);
        pos[i*3+1] += pVel[i*3+1] + Math.sin(t + i * 0.07) * 0.0006;
        pos[i*3+2] += pVel[i*3+2] * (1 + high * 4.5);
        if (pos[i*3]   >  9) pos[i*3]   = -9;
        if (pos[i*3]   < -9) pos[i*3]   =  9;
        if (pos[i*3+1] >  9) pos[i*3+1] =  0.1;
        if (pos[i*3+1] <  0) pos[i*3+1] =  9;
        if (pos[i*3+2] >  9) pos[i*3+2] = -9;
        if (pos[i*3+2] < -9) pos[i*3+2] =  9;
      }
      pGeo.attributes.position.needsUpdate = true;

      composer.render();
    }

    animate();

    // Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
    });

  </script>
</body>
</html>
